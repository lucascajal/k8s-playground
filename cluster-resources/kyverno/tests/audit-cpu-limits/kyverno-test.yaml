apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: audit-container-cpu-limits
policies:
  - ../../policies/audit-cpu-limits.yaml
resources:
  - pods.yaml
results:
  - policy: audit-container-cpu-limits
    rule: check-cpu-limits
    resources:
      - configured
    kind: Pod
    result: pass
  - policy: audit-container-cpu-limits
    rule: check-cpu-limits
    resources:
      - missing-cpu-limit
      - missing-sidecar-cpu-limit
      - missing-init-cpu-limit
    kind: Pod
    result: fail
  - policy: audit-container-cpu-limits
    rule: check-cpu-limits
    resources:
      - excluded-system-pod
    kind: Pod
    result: skip
