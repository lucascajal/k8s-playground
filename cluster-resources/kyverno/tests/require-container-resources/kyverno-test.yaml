apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-container-resources
policies:
  - ../../policies/require-container-resources.yaml
resources:
  - pods.yaml
results:
  - policy: require-container-resources
    rule: require-requests-and-memory-limit
    resources:
      - configured
    kind: Pod
    result: pass
  - policy: require-container-resources
    rule: require-requests-and-memory-limit
    resources:
      - missing-resources
      - missing-cpu-request
      - missing-memory-request
      - missing-memory-limit
      - missing-sidecar-resources
      - missing-init-resources
    kind: Pod
    result: fail
  - policy: require-container-resources
    rule: require-requests-and-memory-limit
    resources:
      - excluded-system-pod
    kind: Pod
    result: skip
